<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" routerLink="/">Dhruv Rajan</a>
    <nav class="site-nav" aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Home</a
      >
      <a routerLink="/events" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Past Performances</a
      >
      <a routerLink="/setlists" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Setlists</a
      >
      <a routerLink="/songs" routerLinkActive="is-active" ariaCurrentWhenActive="page"
        >Songs by Artist</a
      >
      <a routerLink="/lyrics" routerLinkActive="is-active" ariaCurrentWhenActive="page">Lyrics</a>
    </nav>
  </div>
</header>

<main class="site-main" [class.page-narrow]="narrow()" id="main">
  <router-outlet />
</main>
