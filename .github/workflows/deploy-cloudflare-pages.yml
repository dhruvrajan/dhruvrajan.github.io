name: Deploy Cloudflare Pages

on:
  push:
    branches: [angular]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck:functions

      - run: npm run build

      # Deploy from the repo root so wrangler picks up ./functions (Pages Functions),
      # including /lyrics/api/key. Static assets come from the Angular browser build.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/dhruv-music/browser --project-name=dhruv-music --branch=main
